name: Validate Shikimori plugin

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check Shikimori.js

      - name: Run smoke tests
        run: node tests/smoke.cjs
